# Real PostgreSQL via Testcontainers (requires Docker running).
# The jdbc:tc: URL automatically starts an ephemeral container shared by the whole test run.
spring.datasource.url=jdbc:tc:postgresql:17-alpine:///studora_test
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# Flyway configuration for tests
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=false

# Prevent Hibernate from creating its own DDL
spring.jpa.hibernate.ddl-auto=none

# HikariCP pool
spring.datasource.hikari.maximum-pool-size=8

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable cache in tests
spring.cache.type=none
